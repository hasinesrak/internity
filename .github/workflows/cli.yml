name: Internity CLI

on:
  pull_request:
    paths:
      - "packages/cli/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/cli.yml"
  push:
    branches:
      - master
    tags:
      - "cli-v*"
  workflow_dispatch:

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  cli:
    name: Lint, build, and publish CLI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @internity/cli lint

      - name: Build
        run: pnpm --filter @internity/cli build

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          tag_version="${GITHUB_REF_NAME#cli-v}"
          test "$package_version" = "$tag_version" || {
            echo "Tag cli-v$tag_version does not match package version $package_version."
            exit 1
          }

      - name: Check npm token
        if: startsWith(github.ref, 'refs/tags/cli-v')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN" || { echo "Set the NPM_TOKEN repository secret."; exit 1; }

      - name: Publish package
        if: startsWith(github.ref, 'refs/tags/cli-v')
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
