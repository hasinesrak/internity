name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check API URLs set
        env:
          WEB_API_URL: ${{ secrets.WEB_API_URL }}
          STAFF_API_URL: ${{ secrets.STAFF_API_URL }}
        run: test -n "$WEB_API_URL" && test -n "$STAFF_API_URL"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter backend test
      - run: pnpm --filter backend build
      - run: pnpm --filter web build
        env:
          VITE_API_URL: ${{ secrets.WEB_API_URL }}
      - run: pnpm --filter staff build
        env:
          VITE_API_URL: ${{ secrets.STAFF_API_URL }}
