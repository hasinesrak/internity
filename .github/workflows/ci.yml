name: Node.js CI/CD

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  WEB_API_URL: ${{ vars.WEB_API_URL != '' && vars.WEB_API_URL || 'http://api.192.168.0.103.sslip.io' }}
  STAFF_API_URL: ${{ vars.STAFF_API_URL != '' && vars.STAFF_API_URL || 'http://staff-api.192.168.0.103.sslip.io' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run backend tests
        run: pnpm --filter backend test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - lint
      - test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check baked API URLs
        run: |
          case "$WEB_API_URL" in
            *localhost*|*127.0.0.1*)
              echo "WEB_API_URL must be the address the intern browser calls."
              exit 1
              ;;
          esac
          case "$STAFF_API_URL" in
            *localhost*|*127.0.0.1*)
              echo "STAFF_API_URL must be the address the staff browser calls."
              exit 1
              ;;
          esac
          test -n "$WEB_API_URL"
          test -n "$STAFF_API_URL"

      - name: Build application
        run: |
          pnpm --filter backend build
          VITE_API_URL="$WEB_API_URL" pnpm --filter web build
          VITE_API_URL="$STAFF_API_URL" pnpm --filter staff build

      - name: Verify build output
        run: |
          test -f apps/backend/dist/index.js
          test -f apps/web/dist/server/server.js
          test -f apps/staff/dist/server/server.js
          echo "Backend:"
          ls -la apps/backend/dist
          echo "Web:"
          ls -la apps/web/dist
          echo "Staff:"
          ls -la apps/staff/dist

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Check registry credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Set the DOCKERHUB_USERNAME secret."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Set the DOCKERHUB_TOKEN secret."; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Provenance and SBOM indexes are omitted so k3s pulls a plain linux/amd64 image.
      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=internity-backend
          cache-to: type=gha,mode=max,scope=internity-backend
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/internity-backend:sha-${{ github.sha }}

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=internity-web
          cache-to: type=gha,mode=max,scope=internity-web
          build-args: VITE_API_URL=${{ env.WEB_API_URL }}
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/internity-web:sha-${{ github.sha }}

      - name: Build and push staff
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/staff/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=internity-staff
          cache-to: type=gha,mode=max,scope=internity-staff
          build-args: VITE_API_URL=${{ env.STAFF_API_URL }}
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/internity-staff:sha-${{ github.sha }}

      - name: Update deployment manifest and push
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          python3 infra/scripts/set-image-tags.py \
            "$DOCKERHUB_USERNAME" \
            "sha-${GITHUB_SHA}" \
            infra/k8s/overlays/production/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Production image tags already match this commit."
            exit 0
          fi
          git commit -m "Publish images ${GITHUB_SHA::7}"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
