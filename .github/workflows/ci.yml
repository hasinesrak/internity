name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    # The publish workflow creates this manifest-only PR. Its merge must not
    # rebuild and publish the same images a second time.
    paths-ignore:
      - infra/k8s/overlays/production/kustomization.yaml
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  # Frontend API URLs are compiled into the images. Repository Variables are
  # optional because the ingress paths are the safe defaults for this project.
  WEB_API_URL: ${{ vars.PUBLIC_API_URL || '/' }}
  STAFF_API_URL: ${{ vars.STAFF_API_URL || '/staff-api' }}
  STAFF_BASE_PATH: /staff
  PLATFORM_API_URL: ${{ vars.PLATFORM_API_URL || '/' }}

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      NODE_ENV: test
      MONGODB_URI: mongodb://127.0.0.1:27017/internity_test
      JWT_SECRET: ci-only-secret-change-me-32-characters
      BCRYPT_ROUNDS: "4"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
      STAFF_ALLOWED_IPS: ""
      AI_GATEWAY_API_KEY: ""
      RESEND_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Backend tests
        run: pnpm --filter backend test

      - name: Build workspace
        run: pnpm build

      - name: Validate production manifests
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Render production manifests
        run: kubectl kustomize infra/k8s/overlays/production >/dev/null

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical

  build-images:
    name: Build ${{ matrix.image }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: internity-backend
            dockerfile: apps/backend/Dockerfile
            cache_scope: internity-backend
          - image: internity-web
            dockerfile: apps/web/Dockerfile
            cache_scope: internity-web
          - image: internity-staff
            dockerfile: apps/staff/Dockerfile
            cache_scope: internity-staff
          - image: internity-platform
            dockerfile: apps/platform/Dockerfile
            cache_scope: internity-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Select frontend build arguments
        id: docker_args
        shell: bash
        run: |
          {
            echo 'args<<EOF'
            case "${{ matrix.image }}" in
              internity-web)
                echo "VITE_API_URL=${WEB_API_URL}"
                ;;
              internity-staff)
                echo "VITE_API_URL=${STAFF_API_URL}"
                echo "VITE_BASE_PATH=${STAFF_BASE_PATH}"
                ;;
              internity-platform)
                echo "VITE_API_URL=${PLATFORM_API_URL}"
                ;;
            esac
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: ${{ steps.docker_args.outputs.args }}
          tags: ${{ matrix.image }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  smoke-test:
    name: Compose smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create isolated CI environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          APP_HOST=localhost
          JWT_SECRET=ci-only-secret-change-me-32-characters
          MFA_ENCRYPTION_KEY=ci-only-mfa-secret-change-me-32-characters
          ADMIN_EMAIL=ci-admin@example.com
          ADMIN_PASSWORD=CiPassword123
          PLATFORM_ADMIN_EMAIL=platform-ci@example.com
          PLATFORM_ADMIN_PASSWORD=CiPassword123
          STAFF_ALLOW_PRIVATE=true
          PLATFORM_MFA_REQUIRED=false
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the complete stack
        run: docker compose up -d --build --wait

      - name: Check API readiness
        run: |
          curl --fail --silent --show-error http://localhost:4000/health/ready
          curl --fail --silent --show-error http://localhost:4001/health/ready
          curl --fail --silent --show-error http://localhost:4002/health/ready

      - name: Check frontend health
        run: |
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error http://localhost:3001/health
          curl --fail --silent --show-error http://localhost:3002/health

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish ${{ matrix.image }}
    needs: [build-images, smoke-test]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: internity-backend
            dockerfile: apps/backend/Dockerfile
            cache_scope: internity-backend
          - image: internity-web
            dockerfile: apps/web/Dockerfile
            cache_scope: internity-web
          - image: internity-staff
            dockerfile: apps/staff/Dockerfile
            cache_scope: internity-staff
          - image: internity-platform
            dockerfile: apps/platform/Dockerfile
            cache_scope: internity-platform
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "Set the DOCKERHUB_USERNAME repository secret."
            exit 1
          }
          test -n "$DOCKERHUB_TOKEN" || {
            echo "Set the DOCKERHUB_TOKEN repository secret."
            exit 1
          }

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select frontend build arguments
        id: docker_args
        shell: bash
        run: |
          {
            echo 'args<<EOF'
            case "${{ matrix.image }}" in
              internity-web)
                echo "VITE_API_URL=${WEB_API_URL}"
                ;;
              internity-staff)
                echo "VITE_API_URL=${STAFF_API_URL}"
                echo "VITE_BASE_PATH=${STAFF_BASE_PATH}"
                ;;
              internity-platform)
                echo "VITE_API_URL=${PLATFORM_API_URL}"
                ;;
            esac
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          provenance: true
          sbom: true
          build-args: ${{ steps.docker_args.outputs.args }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  promote:
    name: Open deployment PR
    needs: publish
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Point production overlay at this release
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || {
            echo "Set the DOCKERHUB_USERNAME repository secret."
            exit 1
          }
          python3 infra/scripts/set-image-tags.py \
            "$DOCKERHUB_USERNAME" \
            "sha-${GITHUB_SHA}" \
            infra/k8s/overlays/production/kustomization.yaml

      - name: Open deployment pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: master
          branch: ci/deploy-${{ github.sha }}
          delete-branch: true
          commit-message: "Deploy images ${{ github.sha }}"
          title: "Deploy images ${{ github.sha }}"
          body: |
            This pull request promotes the images built from `${{ github.sha }}`.

            Merge it to let Argo CD sync the immutable image tag into K3s.
            The application passed quality gates, image builds, and a full Compose smoke test first.
          add-paths: infra/k8s/overlays/production/kustomization.yaml
