name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
    # A manifest-only merge is already the result of the publish job. Do not
    # rebuild and publish the same commit when that PR lands.
    paths-ignore:
      - infra/k8s/overlays/production/kustomization.yaml
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  # Same-origin defaults work with the VM IP and the path-based ingress.
  WEB_API_URL: ${{ vars.PUBLIC_API_URL || '/' }}
  STAFF_API_URL: ${{ vars.STAFF_API_URL || '/staff-api' }}
  STAFF_BASE_PATH: /staff
  PUBLISH_IMAGES: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/master' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies once
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The current dependency graph has known high-severity advisories in
      # development tooling. Critical findings still block every change;
      # pull requests also run dependency-review below for newly introduced
      # vulnerable packages.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level=critical

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  build-images:
    name: Build container images
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: internity-backend
            dockerfile: apps/backend/Dockerfile
            cache_scope: internity-backend
          - image: internity-web
            dockerfile: apps/web/Dockerfile
            cache_scope: internity-web
          - image: internity-staff
            dockerfile: apps/staff/Dockerfile
            cache_scope: internity-staff
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check registry credentials
        if: env.PUBLISH_IMAGES == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "Set the DOCKERHUB_USERNAME secret."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "Set the DOCKERHUB_TOKEN secret."; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Select frontend build arguments
        id: docker_args
        shell: bash
        run: |
          {
            echo 'args<<EOF'
            case "${{ matrix.image }}" in
              internity-web)
                echo "VITE_API_URL=${WEB_API_URL}"
                ;;
              internity-staff)
                echo "VITE_API_URL=${STAFF_API_URL}"
                echo "VITE_BASE_PATH=${STAFF_BASE_PATH}"
                ;;
            esac
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ env.PUBLISH_IMAGES == 'true' }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-args: ${{ steps.docker_args.outputs.args }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: ${{ env.PUBLISH_IMAGES == 'true' && format('type=gha,mode=max,scope={0}', matrix.cache_scope) || '' }}
          tags: ${{ env.PUBLISH_IMAGES == 'true' && format('docker.io/{0}/{1}:sha-{2}', secrets.DOCKERHUB_USERNAME, matrix.image, github.sha) || format('internity/{0}:ci-{1}', matrix.image, github.sha) }}

  propose-deployment:
    name: Propose deployment manifest update
    needs: build-images
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update image references
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          python3 infra/scripts/set-image-tags.py \
            "$DOCKERHUB_USERNAME" \
            "sha-${GITHUB_SHA}" \
            infra/k8s/overlays/production/kustomization.yaml

      - name: Open deployment pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: ci/deploy-${{ github.ref_name }}
          delete-branch: true
          commit-message: "Deploy images ${{ github.sha }}"
          title: "Deploy images ${{ github.sha }}"
          body: |
            This pull request updates the production overlay to the images built from `${{ github.sha }}`.

            Merge this pull request to let Argo CD sync the new images. The application code was validated before the images were published.
          add-paths: infra/k8s/overlays/production/kustomization.yaml
