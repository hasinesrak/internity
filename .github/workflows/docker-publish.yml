name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - name: internity-backend
            file: apps/backend/Dockerfile
            api: ""
          - name: internity-web
            file: apps/web/Dockerfile
            api: ${{ vars.WEB_API_URL != '' && vars.WEB_API_URL || 'http://localhost:4000' }}
          - name: internity-staff
            file: apps/staff/Dockerfile
            api: ${{ vars.STAFF_API_URL != '' && vars.STAFF_API_URL || 'http://localhost:4001' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            VITE_API_URL=${{ matrix.api }}
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:sha-${{ github.sha }}
