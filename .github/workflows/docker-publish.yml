name: Publish images

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WEB_API_URL: ${{ secrets.WEB_API_URL }}
      STAFF_API_URL: ${{ secrets.STAFF_API_URL }}
    strategy:
      matrix:
        include:
          - name: internity-backend
            file: apps/backend/Dockerfile
          - name: internity-web
            file: apps/web/Dockerfile
          - name: internity-staff
            file: apps/staff/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: |
            ${{ matrix.name == 'internity-web' && format('VITE_API_URL={0}', env.WEB_API_URL) || '' }}
            ${{ matrix.name == 'internity-staff' && format('VITE_API_URL={0}', env.STAFF_API_URL) || '' }}
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:sha-${{ github.sha }}
