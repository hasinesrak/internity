# Backend CI/CD

name: Backend

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/backend/Dockerfile"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.4"
  REGISTRY: docker.io
  IMAGE_BASENAME: internity-backend

jobs:
  # Lint backend code
  lint:
    name: backend / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint backend
        run: pnpm --filter backend lint

  # Check TypeScript types
  typecheck:
    name: backend / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck backend
        run: pnpm --filter backend typecheck

  # Run tests with Mongo
  test:
    name: backend / test
    runs-on: ubuntu-latest
    services:
      # Temporary MongoDB for tests
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test backend
        run: pnpm --filter backend test

  # Verify production build
  build:
    name: backend / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build backend
        run: pnpm --filter backend build

  # Publish image on main
  publish:
    name: backend / publish
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Login with GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Tag with commit SHA
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_BASENAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
      # Build and push image
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Update manifest for ArgoCD
  gitops:
    name: backend / gitops
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # Edit backend tag only
      - name: Point production at the new backend image
        env:
          SHA: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          tag="sha-${SHA}"
          file=infra/k8s/overlays/production/kustomization.yaml
          python3 - "$file" "$DOCKERHUB_USERNAME" "$tag" <<'PY'
          import pathlib, sys
          path, username, tag = sys.argv[1:4]
          lines = pathlib.Path(path).read_text().splitlines(keepends=True)
          out, current = [], None
          for line in lines:
              stripped = line.strip()
              if stripped.startswith("- name:"):
                  current = stripped.split(":", 1)[1].strip()
              if "newName:" in line and "docker.io/" in line and current == "internity-backend":
                  repo = line.rsplit("/", 1)[-1].strip()
                  line = f"    newName: docker.io/{username}/{repo}\n"
              if stripped.startswith("newTag:") and current == "internity-backend":
                  indent = line[: len(line) - len(line.lstrip())]
                  line = f"{indent}newTag: {tag}\n"
              out.append(line)
          pathlib.Path(path).write_text("".join(out))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m "Publish backend ${SHA:0:7}"
          git push
