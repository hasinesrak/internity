apiVersion: v1
kind: ConfigMap
metadata:
  name: internity-config
data:
  NODE_ENV: production
  APP_URL: http://localhost:3000
  STAFF_APP_URL: http://localhost:3001
  PUBLIC_CORS_ORIGIN: http://localhost:3000
  STAFF_CORS_ORIGIN: http://localhost:3001
  JWT_EXPIRES_IN: 8h
  COOKIE_SECURE: "false"
  TRUST_PROXY: "true"
  AI_MODEL: deepseek/deepseek-v4.1-flash
  UPLOAD_DIR: /data/uploads
  UPLOAD_MAX_MB: "10"
