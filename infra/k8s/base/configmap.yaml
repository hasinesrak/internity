apiVersion: v1
kind: ConfigMap
metadata:
  name: internity-config
data:
  NODE_ENV: production
  APP_URL: http://internity.local
  STAFF_APP_URL: http://staff.internity.local
  PUBLIC_CORS_ORIGIN: http://internity.local
  STAFF_CORS_ORIGIN: http://staff.internity.local
  JWT_EXPIRES_IN: 8h
  COOKIE_SECURE: "false"
  TRUST_PROXY: "true"
  AI_MODEL: deepseek/deepseek-v4.1-flash
  UPLOAD_DIR: /data/uploads
  UPLOAD_MAX_MB: "10"
