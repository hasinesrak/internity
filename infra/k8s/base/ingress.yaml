apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity
spec:
  ingressClassName: traefik
  rules:
    # All services share the VM IP. The longer prefixes are selected before
    # the catch-all web route by Kubernetes ingress path matching.
    - http:
        paths:
          - path: /staff-api
            pathType: Prefix
            backend:
              service:
                name: backend-staff
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-public
                port:
                  name: http
          - path: /staff
            pathType: Prefix
            backend:
              service:
                name: staff
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
