apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: platform.internity.local
      http:
        paths:
          - path: /api/platform
            pathType: Prefix
            backend:
              service: { name: backend-platform, port: { name: http } }
          - path: /health
            pathType: Prefix
            backend:
              service: { name: backend-platform, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: platform, port: { name: http } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity
  annotations:
    # Keep uploads working through the same public entry point as the API.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-buffering: "on"
    # The staff-api ingress uses regex rewriting; keep this path boundary-safe
    # when ingress-nginx applies regex mode to all paths for the host.
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /staff(/|$)
            pathType: ImplementationSpecific
            backend:
              service:
                name: staff
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity-public-api
  annotations:
    # Edge limits protect the API process before a request reaches a pod.
    # Account- and action-specific limits remain in the backend.
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache-bypass: "$cookie_internity_session"
    nginx.ingress.kubernetes.io/proxy-no-cache: "$cookie_internity_session"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /health(/|$)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-public
                port:
                  name: http
          - path: /api(/|$)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-public
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity-public-auth
  annotations:
    # Authentication endpoints need a tighter per-client-IP edge limit.
    nginx.ingress.kubernetes.io/limit-rps: "5"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache-bypass: "$cookie_internity_session"
    nginx.ingress.kubernetes.io/proxy-no-cache: "$cookie_internity_session"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/auth(/|$)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-public
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity-staff-api
  annotations:
    # Nginx receives /staff-api/... while the staff API application keeps its
    # existing /api/... routes. The regex preserves /health and /api paths.
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-cache-bypass: "$cookie_internity_session"
    nginx.ingress.kubernetes.io/proxy-no-cache: "$cookie_internity_session"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /staff-api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend-staff
                port:
                  name: http
