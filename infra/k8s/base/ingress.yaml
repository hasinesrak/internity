apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity
spec:
  ingressClassName: traefik
  rules:
    # All services share the VM IP. The longer prefixes are selected before
    # the catch-all web route by Kubernetes ingress path matching.
    - http:
        paths:
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend-public
                port:
                  name: http
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-public
                port:
                  name: http
          - path: /staff
            pathType: Prefix
            backend:
              service:
                name: staff
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: staff-api-prefix
spec:
  stripPrefix:
    prefixes:
      - /staff-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity-staff-api
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: internity-staff-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /staff-api
            pathType: Prefix
            backend:
              service:
                name: backend-staff
                port:
                  name: http