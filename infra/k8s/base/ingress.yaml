apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity
spec:
  rules:
    - host: internity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
    - host: api.internity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-public
                port:
                  name: http
    - host: staff.internity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: staff
                port:
                  name: http
    - host: staff-api.internity.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-staff
                port:
                  name: http
