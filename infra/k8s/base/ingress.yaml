apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: internity
spec:
  ingressClassName: traefik
  rules:
    # Use these names in /etc/hosts on the VM and on each developer laptop.
    # Keeping one host per service avoids four ambiguous "localhost /" routes.
    - host: internity.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
    - host: api.internity.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-public
                port:
                  name: http
    - host: staff.internity.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: staff
                port:
                  name: http
    - host: staff-api.internity.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-staff
                port:
                  name: http
