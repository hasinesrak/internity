apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-staff
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend-staff
  template:
    metadata:
      labels:
        app: backend-staff
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 25
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: internity-backend
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "4000"
            - name: HOME
              value: /tmp
            - name: API_SURFACE
              value: staff
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: NODE_ENV
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: JWT_SECRET
            - name: APP_URL
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: APP_URL
            - name: STAFF_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: STAFF_APP_URL
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: STAFF_CORS_ORIGIN
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: JWT_EXPIRES_IN
            - name: COOKIE_SECURE
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: COOKIE_SECURE
            - name: TRUST_PROXY
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: TRUST_PROXY
            - name: STAFF_ALLOWED_IPS
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: STAFF_ALLOWED_IPS
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: RESEND_API_KEY
                  optional: true
            - name: RESEND_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: RESEND_FROM_EMAIL
                  optional: true
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: GROQ_API_KEY
                  optional: true
            - name: GROQ_MODEL
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: GROQ_MODEL
            - name: ADMIN_NAME
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: ADMIN_NAME
                  optional: true
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: ADMIN_EMAIL
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: internity-secrets
                  key: ADMIN_PASSWORD
                  optional: true
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: UPLOAD_DIR
            - name: UPLOAD_MAX_MB
              valueFrom:
                configMapKeyRef:
                  name: internity-config
                  key: UPLOAD_MAX_MB
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: uploads-data
              mountPath: /data/uploads
          lifecycle:
            preStop:
              exec:
                command: ["node", "-e", "setTimeout(() => process.exit(0), 5000)"]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data
