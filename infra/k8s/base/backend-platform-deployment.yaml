apiVersion: apps/v1
kind: Deployment
metadata: { name: backend-platform }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend-platform } }
  template:
    metadata: { labels: { app: backend-platform } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: backend
          image: internity-backend
          ports: [{ name: http, containerPort: 4002 }]
          env:
            - { name: HOST, value: "0.0.0.0" }
            - { name: PORT, value: "4002" }
            - { name: API_SURFACE, value: platform }
            - { name: HOME, value: /tmp }
            - { name: NODE_ENV, valueFrom: { configMapKeyRef: { name: internity-config, key: NODE_ENV } } }
            - { name: MONGODB_URI, valueFrom: { secretKeyRef: { name: internity-secrets, key: MONGODB_URI } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: internity-secrets, key: JWT_SECRET } } }
            - { name: MFA_ENCRYPTION_KEY, valueFrom: { secretKeyRef: { name: internity-secrets, key: MFA_ENCRYPTION_KEY } } }
            - { name: PLATFORM_MFA_REQUIRED, value: "true" }
            - { name: PLATFORM_APP_URL, valueFrom: { configMapKeyRef: { name: internity-config, key: PLATFORM_APP_URL } } }
            - { name: CORS_ORIGIN, valueFrom: { configMapKeyRef: { name: internity-config, key: PLATFORM_CORS_ORIGIN } } }
            - { name: JWT_EXPIRES_IN, valueFrom: { configMapKeyRef: { name: internity-config, key: JWT_EXPIRES_IN } } }
            - { name: PLATFORM_SESSION_EXPIRES_IN, value: "30m" }
            - { name: COOKIE_SECURE, valueFrom: { configMapKeyRef: { name: internity-config, key: COOKIE_SECURE } } }
            - { name: TRUST_PROXY, valueFrom: { configMapKeyRef: { name: internity-config, key: TRUST_PROXY } } }
            - { name: REDIS_URL, valueFrom: { configMapKeyRef: { name: internity-config, key: REDIS_URL } } }
            - { name: PLATFORM_ADMIN_EMAIL, valueFrom: { secretKeyRef: { name: internity-secrets, key: PLATFORM_ADMIN_EMAIL, optional: true } } }
            - { name: PLATFORM_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: internity-secrets, key: PLATFORM_ADMIN_PASSWORD, optional: true } } }
            - { name: STRIPE_SECRET_KEY, valueFrom: { secretKeyRef: { name: internity-secrets, key: STRIPE_SECRET_KEY, optional: true } } }
            - { name: STRIPE_WEBHOOK_SECRET, valueFrom: { secretKeyRef: { name: internity-secrets, key: STRIPE_WEBHOOK_SECRET, optional: true } } }
            - { name: STRIPE_STARTER_PRICE_ID, valueFrom: { secretKeyRef: { name: internity-secrets, key: STRIPE_STARTER_PRICE_ID, optional: true } } }
            - { name: STRIPE_GROWTH_PRICE_ID, valueFrom: { secretKeyRef: { name: internity-secrets, key: STRIPE_GROWTH_PRICE_ID, optional: true } } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 20 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
