apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: internity
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_OWNER/internity.git
    targetRevision: main
    path: infra/k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: internity
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
