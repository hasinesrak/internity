name: internity

x-backend-environment: &backend-environment
  NODE_ENV: development
  MONGODB_URI: mongodb://mongo:27017/internity
  APP_URL: ${APP_URL:-http://localhost:3000}
  STAFF_APP_URL: ${STAFF_APP_URL:-http://localhost:3001}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  COOKIE_SECURE: "false"
  TRUST_PROXY: ${TRUST_PROXY:-false}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Internity <beth.t@example.com>}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
  ADMIN_NAME: ${ADMIN_NAME:-Admin}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  UPLOAD_DIR: /data/uploads
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}

services:
  mongo:
    image: mongo:7.0
    container_name: internity-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./data/db:/data/db
      # The mongo image also declares VOLUME /data/configdb. Leave that path
      # unmounted and every container recreate keeps a new anonymous volume.
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-public:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${PUBLIC_API_BIND:-0.0.0.0}:${PUBLIC_API_PORT:-4000}:${API_CONTAINER_PORT:-4000}"
    environment:
      <<: *backend-environment
      HOST: ${HOST:-0.0.0.0}
      PORT: ${API_CONTAINER_PORT:-4000}
      API_SURFACE: public
      CORS_ORIGIN: ${PUBLIC_CORS_ORIGIN:-http://localhost:3000}
      STAFF_ALLOWED_IPS: ""
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  backend-staff:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${STAFF_API_BIND:-127.0.0.1}:${STAFF_API_PORT:-4001}:${API_CONTAINER_PORT:-4000}"
    environment:
      <<: *backend-environment
      HOST: ${HOST:-0.0.0.0}
      PORT: ${API_CONTAINER_PORT:-4000}
      API_SURFACE: staff
      CORS_ORIGIN: ${STAFF_CORS_ORIGIN:-http://localhost:3001}
      STAFF_ALLOWED_IPS: ${STAFF_ALLOWED_IPS:-}
      STAFF_ALLOW_PRIVATE: ${STAFF_ALLOW_PRIVATE:-true}
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "${WEB_HOST:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production

  staff:
    build:
      context: .
      dockerfile: apps/staff/Dockerfile
      args:
        VITE_API_URL: ${VITE_STAFF_API_URL:-http://localhost:4001}
    ports:
      - "${STAFF_HOST:-127.0.0.1}:${STAFF_PORT:-3001}:3001"
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      NODE_ENV: production
      STAFF_ALLOWED_IPS: ${STAFF_ALLOWED_IPS:-}
      STAFF_ALLOW_PRIVATE: ${STAFF_ALLOW_PRIVATE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}

volumes:
  uploads-data:
    name: internity-uploads-data
  mongo-config:
    name: internity-mongo-config
