name: internity

x-backend-environment: &backend-environment
  NODE_ENV: development
  HOME: /tmp
  MONGODB_URI: mongodb://mongo:27017/internity
  APP_URL: ${APP_URL:-http://${APP_HOST:-localhost}:3000}
  STAFF_APP_URL: ${STAFF_APP_URL:-http://${APP_HOST:-localhost}:3001}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dhaka}
  JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-please-32}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  COOKIE_SECURE: "false"
  TRUST_PROXY: ${TRUST_PROXY:-false}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Internity <beth.t@example.com>}
  AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-deepseek/deepseek-v4.1-flash}
  AI_FILE_MODEL: ${AI_FILE_MODEL:-google/gemini-3.5-flash-lite}
  RAILWAY_NEW_SSH_PRIVATE_KEY_B64: ${RAILWAY_NEW_SSH_PRIVATE_KEY_B64:-}
  RAILWAY_NEW_SSH_KEY_PATH: ${RAILWAY_NEW_SSH_KEY_PATH:-}
  ADMIN_NAME: ${ADMIN_NAME:-Admin}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  UPLOAD_DIR: /data/uploads
  UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}

x-app-hardening: &app-hardening
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  mongo:
    image: mongo:7.0
    container_name: internity-mongo
    init: true
    restart: unless-stopped
    ports:
      - "${MONGO_BIND:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - ./data/db:/data/db
      # The mongo image also declares VOLUME /data/configdb. Leave that path
      # unmounted and every container recreate keeps a new anonymous volume.
      - mongo-config:/data/configdb
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend-public:
    <<: *app-hardening
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${PUBLIC_API_BIND:-0.0.0.0}:${PUBLIC_API_PORT:-4000}:${API_CONTAINER_PORT:-4000}"
    environment:
      <<: *backend-environment
      HOST: ${HOST:-0.0.0.0}
      PORT: ${API_CONTAINER_PORT:-4000}
      API_SURFACE: public
      CORS_ORIGIN: ${PUBLIC_CORS_ORIGIN:-http://${APP_HOST:-localhost}:3000}
      STAFF_ALLOWED_IPS: ""
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  backend-staff:
    <<: *app-hardening
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "${STAFF_API_BIND:-0.0.0.0}:${STAFF_API_PORT:-4001}:${API_CONTAINER_PORT:-4000}"
    environment:
      <<: *backend-environment
      HOST: ${HOST:-0.0.0.0}
      PORT: ${API_CONTAINER_PORT:-4000}
      API_SURFACE: staff
      CORS_ORIGIN: ${STAFF_CORS_ORIGIN:-http://${APP_HOST:-localhost}:3001}
      STAFF_ALLOWED_IPS: ${STAFF_ALLOWED_IPS:-}
      STAFF_ALLOW_PRIVATE: ${STAFF_ALLOW_PRIVATE:-true}
    volumes:
      - uploads-data:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  web:
    <<: *app-hardening
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_PUBLIC_API_URL:-http://${APP_HOST:-localhost}:4000}
        VITE_APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dhaka}
    ports:
      - "${WEB_HOST:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      HOME: /tmp
      NODE_ENV: production
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  staff:
    <<: *app-hardening
    build:
      context: .
      dockerfile: apps/staff/Dockerfile
      args:
        VITE_API_URL: ${VITE_STAFF_API_URL:-http://${APP_HOST:-localhost}:4001}
    ports:
      - "${STAFF_HOST:-0.0.0.0}:${STAFF_PORT:-3001}:3001"
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      HOME: /tmp
      NODE_ENV: production
      STAFF_ALLOWED_IPS: ${STAFF_ALLOWED_IPS:-}
      STAFF_ALLOW_PRIVATE: ${STAFF_ALLOW_PRIVATE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

volumes:
  uploads-data:
    name: internity-uploads-data
  mongo-config:
    name: internity-mongo-config
